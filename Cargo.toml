[package]
name = "druid-garden-os"
version = "1.2.0"
edition = "2021"

[lib]
name="druid_garden_os"
path="src/lib.rs"

[[bin]]
name="druid-garden-os"
path="src/main.rs"

[dependencies]
argon2 = { version = "0.5.3"}
blst = "0.3.14"
bollard = "0.18.1"
dg_edge_updater = { git = "https://github.com/GalactechsLLC/dg_edge_updater.git", branch = "main" }
dg_fast_farmer = { git = "https://github.com/GalactechsLLC/dg_fast_farmer.git", branch = "main" }
dg_xch_clients = { git = "https://github.com/GalactechsLLC/dg_xch_utils.git", branch = "main" }
dg_xch_core = { git = "https://github.com/GalactechsLLC/dg_xch_utils.git", branch = "main" }
dg_logger = { git = "https://github.com/GalactechsLLC/dg_xch_utils.git", branch = "main" }
dg_sysfs = { git = "https://github.com/GalactechsLLC/dg_sysfs_utils.git", branch = "main" }
dg_network_manager = { git = "https://github.com/GalactechsLLC/dg_network_manager.git", branch = "main" }
gpiod = "0.3.0"
home = "0.5.11"
infer = "0.19.0"
log = "0.4.22"
nvml-wrapper = "0.10.0"
portfu = { version = "1.3.3" }
portfu_admin = { version = "1.3.3", features = ["sqlx"]}
portfu_core = { version = "1.3.3"}
portfu_macros = { version = "1.3.3"}
sqlx = { version = "0.8.3", features = ["sqlite", "migrate", "time", "runtime-tokio"]}
tempfile = "3.18.0"
time = {version = "0.3.36", features = ["serde-human-readable", "parsing", "serde"]}
tokio = { version = "1.45.1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
reqwest = {version="0.12.4", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = {version = "0.23.29" }
semver = { version = "1.0.26", features = ["serde"]}
serde = { version = "1.0.217", features = ["derive"] }
serde_yaml = "0.9.33"
sha2 = "0.10.8"
sysinfo = "0.35.1"
libc = "0.2.172"

# Use the reviewed updater changes until they are published to its main branch.
[patch."https://github.com/GalactechsLLC/dg_edge_updater.git"]
dg_edge_updater = { path = "dg_edge_updater" }
